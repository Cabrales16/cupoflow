<!-- ═══════════════════════ MODALES ══════════════════════════ -->

<!-- Drawer: Detalle Crédito (panel lateral deslizante) -->
<div id="drawerOverlay" class="hidden" onclick="if(event.target===this)cerrarDrawer()">
  <div id="drawerPanel">
    <div class="drawer-head">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <div class="drawer-head-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        <div style="min-width:0;">
          <div class="drawer-title" id="drawerTitle">Detalle de crédito</div>
          <div class="drawer-sub" id="drawerSub">—</div>
        </div>
      </div>
      <button class="drawer-close" onclick="cerrarDrawer()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" onclick="cerrarDrawer()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal: Detalle Centro -->
<div id="modalCentro" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-head-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div>
          <div class="modal-title" id="mCentroNombre">Centro</div>
          <div class="modal-sub" id="mCentroCodigo">—</div>
        </div>
      </div>
      <button class="modal-close" onclick="cerrarModalCentro()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="info-grid">
        <div class="info-item"><div class="info-label">Razón Social</div><div class="info-value" id="mCentroRazon">—</div></div>
        <div class="info-item"><div class="info-label">NIT</div><div class="info-value mono" id="mCentroNit">—</div></div>
        <div class="info-item info-full">
          <div class="info-label">Total créditos activos</div>
          <div class="info-value" id="mCentroTotal" style="font-family:var(--font-mono);color:var(--navy2);font-size:20px;">—</div>
        </div>
      </div>
      <div class="info-section-title">Solicitudes vinculadas</div>
      <div id="mCentroSolicitudes" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="cerrarModalCentro()">Cerrar</button></div>
  </div>
</div>

<!-- Modal: Confirmación -->
<div id="modalConfirm" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-head-ico" style="background:var(--warning-bg);border-color:var(--warning-border);">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="modal-title" id="confirmTitulo">Confirmar acción</div>
      </div>
      <button class="modal-close" onclick="cerrarModalConfirm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p style="font-size:14.5px;color:var(--text2);line-height:1.5;" id="confirmMsg"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModalConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirmBtnAccept">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal: Comentario Ejecutivo -->
<div id="modalComentario" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-head-ico" style="background:var(--success-bg);border-color:var(--success-border);">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div>
          <div class="modal-title">Comentarios de la Solicitud</div>
          <div class="modal-sub" id="mComentarioSub">—</div>
        </div>
      </div>
      <button class="modal-close" onclick="cerrarModalComentario()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="mComentarioUuid">
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;">Comentarios o Novedades:</label>
        <textarea id="mComentarioTexto" rows="5" style="width:100%;padding:10px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13.5px;box-sizing:border-box;resize:vertical;" placeholder="Escribe un comentario o novedad sobre esta solicitud…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModalComentario()">Cancelar</button>
      <button class="btn btn-gold" id="btnGuardarComentarioPortal" onclick="guardarComentarioPortal()">Guardar Comentario</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
