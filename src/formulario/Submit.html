const CHUNK_SIZE_BYTES = 256 * 1024; // 200 KB

/* ═══════════════════════════════════════
   uploadFileChunks
═══════════════════════════════════════ */
async function uploadFileChunks(code, file, docsFolderId) {
  const initRes = await new Promise((resolve, reject) =>
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .apiInitUploadDocumento({
        uuid:           STATE.submissionUuid,
        tipo_documento: code,
        docs_folder_id: docsFolderId,
        nombre_archivo: file.name,
        mime:           'application/pdf'
      })
  );

  const uploadKey   = initRes.upload_key;
  const total       = file.size;
  const totalChunks = Math.ceil(total / CHUNK_SIZE_BYTES);

  for (let i = 0; i < totalChunks; i++) {
    const start  = i * CHUNK_SIZE_BYTES;
    const end    = Math.min(start + CHUNK_SIZE_BYTES, total) - 1;
    const slice  = file.slice(start, end + 1);

    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload  = () => res(reader.result.split(',')[1]);
      reader.onerror = () => rej(new Error('No se pudo procesar el archivo: ' + file.name + '. Verifica que sea un PDF válido.'));
      reader.readAsDataURL(slice);
    });

    const chunkRes = await new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiUploadChunk({ upload_key: uploadKey, chunk_base64: base64, start, end, total, mime: 'application/pdf' })
    );

    if (chunkRes.done) {
          await new Promise((resolve, reject) =>
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .apiRegistrarDocumentoEnCola({
                uuid:           STATE.submissionUuid,
                tipo_documento: code,
                drive_file_id:  chunkRes.drive_file_id,
                nombre_archivo: file.name,
                tamano_bytes:   file.size,
                hash_sha256:    '',
                fecha_subida:   new Date().toISOString()
              })
          );
          break;
        }
      }
}

/* ═══════════════════════════════════════
   Email Verification
   ═══════════════════════════════════════ */
async function sendVerificationCode() {
  const email = ($('correo_rep') || {}).value || '';
  if (!email) {
    showValidationModal('No se encontró el correo del representante legal. Por favor verifica el Paso 2.');
    return;
  }

  const btn = $('btnSendVerification');
  const resendBtn = $('btnResendCode');
  if (btn) btn.disabled = true;
  if (resendBtn) resendBtn.style.display = 'none';
  
  const statusEl = $('verification-status');
  if (statusEl) {
    statusEl.className = '';
    statusEl.textContent = 'Enviando código...';
    statusEl.style.display = 'block';
  }

  try {
    await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiSendVerificationCode(email);
    });

    $('verify-initial-row').style.display = 'none';
    $('verify-input-row').style.display = 'block';
    
    if (statusEl) {
      statusEl.className = 'success';
      statusEl.textContent = 'Código enviado. Revisa tu bandeja de entrada.';
    }
    
    setTimeout(() => {
      if (resendBtn) resendBtn.style.display = 'block';
    }, 30000);

  } catch (err) {
    if (btn) btn.disabled = false;
    if (statusEl) {
      statusEl.className = 'error';
      statusEl.textContent = 'Error al enviar: ' + getFriendlyErrorMessage(err);
    }
  }
}

async function verifyCode() {
  const code = ($('verification_code') || {}).value.trim().toUpperCase();
  const email = ($('correo_rep') || {}).value || '';
  const btn = $('btnVerifyCode');
  const statusEl = $('verification-status');

  if (code.length < 6) {
    if (statusEl) {
      statusEl.className = 'error';
      statusEl.textContent = 'El código debe tener 6 caracteres.';
      statusEl.style.display = 'block';
    }
    return;
  }

  if (btn) btn.disabled = true;
  if (statusEl) {
    statusEl.className = '';
    statusEl.textContent = 'Validando...';
    statusEl.style.display = 'block';
  }

  try {
    const isOk = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiVerifyCode(email, code);
    });

    if (isOk) {
      STATE.emailVerified = true;
      
      const verifyStatusEl = $('sum-verify-status');
      if (verifyStatusEl) {
        verifyStatusEl.innerHTML = '<span style="color:#27ae60">● Verificado vía email</span>';
      }
      
      // Rediseño de éxito compacto
      const body = document.querySelector('.v-card-body');
      body.innerHTML = `
        <div style="text-align:center; padding:10px 0;">
          <div class="verification-success-icon" style="width:40px; height:40px; background:#1e7e44; color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:20px;"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h4 style="color:#1e7e44; margin:0; font-size:15px; font-weight:800;">Identidad Verificada</h4>
          <p style="color:#496b66; font-size:12px; margin-top:4px;">Código validado correctamente. Puedes enviar la solicitud.</p>
        </div>
      `;
      
      const btnSubmit = $('btnSubmit');
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('btn-disabled');
      }
    } else {
      if (btn) btn.disabled = false;
      if (statusEl) {
        statusEl.className = 'error';
        statusEl.textContent = 'Código incorrecto. Inténtalo de nuevo.';
      }
    }
  } catch (err) {
    if (btn) btn.disabled = false;
    if (statusEl) {
      statusEl.className = 'error';
      statusEl.textContent = 'Error al validar: ' + getFriendlyErrorMessage(err);
    }
  }
}



/* ═══════════════════════════════════════
   submitForm
═══════════════════════════════════════ */
async function submitForm() {
  if (STATE.submitting) return;
  if (!($('acepta') || {}).checked) {
    showValidationModal('Debes aceptar los <strong>términos y condiciones</strong> para continuar.');
    return;
  }
  if (!STATE.emailVerified) {
    showValidationModal('Debes <strong>verificar tu correo electrónico</strong> con el código de 6 dígitos antes de enviar.');
    return;
  }

  STATE.submitting = true;
  const btnSubmit = $('btnSubmit');
  if (btnSubmit) btnSubmit.disabled = true;

  const modal    = $('uploadModal');
  const btnClose = $('btnModalClose');
  if (modal)    { modal.setAttribute('aria-hidden', 'false'); modal.classList.remove('hidden'); lockScroll(); }
  if (btnClose) btnClose.disabled = true;

  setMeter(5, 'Procesando solicitud…');

  try {
    const v = id => ($(id) || {}).value || '';

    const montoStr = v('monto').replace(/\./g, '').replace(',', '.');
    const montoNum = parseFloat(montoStr) || 0;

    const inscrEl    = document.querySelector('input[name="fact_inscripcion"]:checked');
    const inscripcion = inscrEl ? inscrEl.value : 'NO';

    const refs = getRefsData();

    const fiscal = _buildFiscalValue_();

    const centroCodigo = STATE.selectedCentros.map(h => h.codigo).join(',');
    const primaryCentro = STATE.selectedCentros.length ? STATE.selectedCentros[0].codigo : '';

    const payload = {
      tipo_solicitud:         v('tipo_solicitud'),
      centro_codigo:           centroCodigo,          // todos los centros, no solo primaryCentro
      razon_social:           v('razon_social'),
      nombre_comercial:       v('nombre_comercial'),
      identificacion:         v('nit'),
      direccion:              v('direccion'),
      ciudad:                 v('ciudad'),
      departamento:           v('departamento'),
      cod_postal:             v('cod_postal'),
      nombre_rep_legal:       v('nombre_rep_legal'),
      tipo_id_rep:            v('tipo_id_rep'),
      num_id_rep:             v('num_id_rep'),
      cargo_rep:              v('cargo_rep'),
      tel_rep:                v('tel_rep'),
      correo_rep:             v('correo_rep'),
      responsabilidad_fiscal: fiscal,
      monto:                  montoNum,
      moneda:                 v('moneda') || 'COP',
      ejecutivo_cuenta:       v('ejecutivo_cuenta'),
      fecha_diligenciamiento: today(),
      contactos_json: JSON.stringify([
        { area:'Tesorería',           nombre:v('cont_tes_nombre'), tel:v('cont_tes_tel'),  email:v('cont_tes_email')  },
        { area:'Cuentas por pagar',   nombre:v('cont_cp_nombre'),  tel:v('cont_cp_tel'),   email:v('cont_cp_email')   },
        { area:'Director Financiero', nombre:v('cont_df_nombre'),  tel:v('cont_df_tel'),   email:v('cont_df_email')   },
        { area:'Comercial',           nombre:v('cont_com_nombre'), tel:v('cont_com_tel'),  email:v('cont_com_email')  }
      ]),
      fact_fecha_corte:   v('fact_fecha_corte'),
      fact_fecha_expedicion_cert: v('docVigDate_CERT_EXISTENCIA'),
      fact_fecha_expedicion_carta: v('docVigDate_CARTA_SIN_EEFF'),
      fact_email_cc:      v('fact_email_cc'),
      fact_inscripcion:   inscripcion,
      fact_docs_req:      v('fact_docs_req'),
      fact_email:         v('fact_email'),
      refs_otros_centros: refs.length ? 'SI' : 'NO',
      referencias_json:   JSON.stringify(refs),
      comentarios:        ($('es_filial') && $('es_filial').checked) ? (`[Filial: ${v('filial_razon_social')} - NIT: ${v('filial_nit')}]\n` + ($('observaciones') ? $('observaciones').value.trim() : '')) : ($('observaciones') ? $('observaciones').value.trim() : ''),
      es_filial:          ($('es_filial') && $('es_filial').checked) ? 'SI' : 'NO',
      ip_dispositivo:     STATE.ip_dispositivo || ''
    };

    setMeter(10, 'Registrando solicitud…');
    const startRes = await new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiStartSubmission(payload)
    );

    STATE.submissionUuid  = startRes.uuid;
    STATE.codigoSolicitud = startRes.codigo_solicitud;
    STATE.carpetaDriveId  = startRes.carpeta_drive_id;
    const docsFolderId    = startRes.docs_folder_id;
    const carpetaRaizId   = startRes.carpeta_drive_id;
    // carpetaRaizId: carpetaRaizId
    // startRes completo: JSON.stringify(startRes)



    const allUploads = [];

    // Archivos individuales (todos excepto los multi)
    Object.keys(STATE.filesByCode).forEach(code => {
      allUploads.push({ code, file: STATE.filesByCode[code] });
    });

    // Multi-archivos (ESTADOS_FIN y cualquier otro futuro)
    Object.keys(STATE.filesMultiByCode).forEach(code => {
      (STATE.filesMultiByCode[code] || []).forEach(file => {
        allUploads.push({ code, file });
      });
    });

    for (let i = 0; i < allUploads.length; i++) {
      const { code, file } = allUploads[i];
      const pct = 15 + Math.round(((i + 1) / allUploads.length) * 70);
      setMeter(pct, `Subiendo archivo ${i + 1} de ${allUploads.length}…`);
      await uploadFileChunks(code, file, docsFolderId);
    }

    setMeter(86, 'Generando formato PDF…');
    try {
      await _generarPdfFormularioClienteSide_();
    } catch (pdfErr) {
      console.warn('[PDF] Generación client-side falló, el servidor generará el PDF:', pdfErr && pdfErr.message || pdfErr);
    }
    setMeter(93, 'Finalizando…');
    await new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiFinalizarSolicitud({
          uuid:               STATE.submissionUuid,
          codigo_solicitud:   STATE.codigoSolicitud,
          acepta_condiciones: 'TRUE',
          acepta_datos:       'TRUE',
          ip_dispositivo:     STATE.ip_dispositivo || ''
        })
    );

    setMeter(100, '¡Solicitud enviada con éxito!');
    STATE.submitted = true;
    const btnDraft = $('btnGuardarBorrador');
    if (btnDraft) btnDraft.style.display = 'none';

    const mTitle = modal && modal.querySelector('.modal-title');
    const mSub   = modal && modal.querySelector('.modal-sub');
    if (mTitle) mTitle.textContent = '¡Solicitud enviada!';
    if (mSub)   mSub.innerHTML    =
      `Código: <strong>${STATE.codigoSolicitud}</strong><br>Recibirás respuesta por correo electrónico.`;
    if (btnClose) { btnClose.disabled = false; btnClose.textContent = 'Cerrar'; }
    draftClear();

  } catch (err) {
    STATE.submitting = false;
    if (modal)     { modal.classList.add('hidden'); unlockScroll(); }
    if (btnSubmit) btnSubmit.disabled = false;
    if (btnClose)  btnClose.disabled  = false;
    showValidationModal(
      'Ocurrió un error al enviar la solicitud:<br><br>' +
      '<strong>' + getFriendlyErrorMessage(err) + '</strong><br><br>' +
      'Intenta nuevamente. Si el error persiste, contacta al área de créditos.',
      'Inconveniente al enviar'
    );
  }
}

function _escHtml_(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/**
 * Construye el valor a guardar en responsabilidad_fiscal a partir de los checkboxes
 * marcados. Si se marcó "Otro", codifica el texto libre como "OTRO:<texto>" (sin comas,
 * ya que la coma es el separador entre códigos) en vez del código plano "OTRO".
 */
function _buildFiscalValue_() {
  const otroTexto = (($('fiscalOtroTexto') || {}).value || '').trim().replace(/,/g, ' ');
  return Array.from(document.querySelectorAll('.fiscal-check:checked'))
    .map(c => (c.value === 'OTRO' && otroTexto) ? ('OTRO:' + otroTexto) : c.value)
    .join(',');
}

async function _generarPdfFormularioClienteSide_() {
  const v = id => (document.getElementById(id) || {}).value || '';
  const inscrEl = document.querySelector('input[name="fact_inscripcion"]:checked');
  const fiscal  = _buildFiscalValue_();

  // Intentar obtener logo en base64 desde el servidor
  let logoB64 = null;
  try {
    const logoRes = await new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiGetLogoBase64()
    );
    if (logoRes && logoRes.ok) logoB64 = logoRes.b64;
  } catch(e) { /* logo text fallback */ }

  const data = {
    tipo_solicitud:         v('tipo_solicitud'),
    razon_social:           v('razon_social'),
    nombre_comercial:       v('nombre_comercial'),
    identificacion:         v('nit'),
    direccion:              v('direccion'),
    ciudad:                 v('ciudad'),
    departamento:           v('departamento'),
    cod_postal:             v('cod_postal'),
    nombre_rep_legal:       v('nombre_rep_legal'),
    tipo_id_rep:            v('tipo_id_rep'),
    num_id_rep:             v('num_id_rep'),
    cargo_rep:              v('cargo_rep'),
    tel_rep:                v('tel_rep'),
    correo_rep:             v('correo_rep'),
    responsabilidad_fiscal: fiscal,
    monto:                  v('monto').replace(/\./g, '').replace(',', '.'),
    moneda:                 v('moneda') || 'COP',
    ejecutivo_cuenta:       v('ejecutivo_cuenta'),
    fecha_diligenciamiento: v('fecha_diligenciamiento') || (typeof today === 'function' ? today() : ''),
    fact_fecha_corte:       v('fact_fecha_corte'),
    fact_inscripcion:       inscrEl ? inscrEl.value : 'NO',
    fact_docs_req:          v('fact_docs_req'),
    fact_email:             v('fact_email'),
    fact_email_cc:          v('fact_email_cc'),
    contactos: [
      { area: 'Tesorería',           nombre: v('cont_tes_nombre'), tel: v('cont_tes_tel'),  email: v('cont_tes_email')  },
      { area: 'Cuentas por pagar',   nombre: v('cont_cp_nombre'),  tel: v('cont_cp_tel'),   email: v('cont_cp_email')   },
      { area: 'Director Financiero', nombre: v('cont_df_nombre'),  tel: v('cont_df_tel'),   email: v('cont_df_email')   },
      { area: 'Comercial',           nombre: v('cont_com_nombre'), tel: v('cont_com_tel'),  email: v('cont_com_email')  }
    ],
    codigo_solicitud: STATE.codigoSolicitud || '',
    ip_dispositivo:   STATE.ip_dispositivo || ''
  };

  const centros = (STATE.selectedCentros || []).map(sh => {
    const catalogCentro = (STATE.catalogos && STATE.catalogos.centros || []).find(ch => ch.codigo === sh.codigo);
    return catalogCentro ? catalogCentro : sh;
  });
  const { pages, css } = _buildFormularioPdfHtml_(data, centros, logoB64);
  const canvases = [];

  const renderPage = (idx) => new Promise((res, rej) => {
    if (idx >= pages.length) { res(); return; }
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:816px;height:1056px;border:none;z-index:1;';
    const fullHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css + '</style></head><body>' + pages[idx] + '</body></html>';
    iframe.setAttribute('srcdoc', fullHtml);
    document.body.appendChild(iframe);
    iframe.onload = function () {
      setTimeout(function () {
        const pageEl = iframe.contentDocument.querySelector('.page') || iframe.contentDocument.body;
        html2canvas(pageEl, {
          scale: 3, useCORS: true, logging: false,
          windowWidth: 816, windowHeight: 1056, scrollX: 0, scrollY: 0
        }).then(function (canvas) {
          document.body.removeChild(iframe);
          canvases.push(canvas);
          renderPage(idx + 1).then(res).catch(rej);
        }).catch(function (e) {
          if (iframe.parentNode) document.body.removeChild(iframe);
          rej(e);
        });
      }, 250);
    };
  });

  await renderPage(0);

  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFCtor) throw new Error('jsPDF no disponible — revisa los CDN en Index.html');

  const doc = new jsPDFCtor({ unit: 'pt', format: 'letter', orientation: 'portrait' });
  canvases.forEach((canvas, i) => {
    if (i > 0) doc.addPage();
    doc.addImage(canvas.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, 612, 792);
  });

  const buffer = doc.output('arraybuffer');
  const bytes  = new Uint8Array(buffer);
  let binary   = '';
  for (let j = 0; j < bytes.byteLength; j++) binary += String.fromCharCode(bytes[j]);
  const pdfBase64 = btoa(binary);

  const razonSafe = (data.razon_social || 'Solicitud').replace(/[<>:"/\\|?*]/g, ' ').trim().slice(0, 60);

  await new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .apiGuardarPdfSolicitud({
        uuid:             STATE.submissionUuid,
        pdfBase64:        pdfBase64,
        fileName:         'OX-F-GFI-18_' + razonSafe + '.pdf',
        carpeta_drive_id: STATE.carpetaDriveId || ''
      });
  });
}
