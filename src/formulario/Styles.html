   8. Inputs, Select, Textarea

   13. Monto

/* ─── 1. Fonts & Variables ─────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --navy:       #487b71;
  --navy2:      #3c6c62;
  --navy3:      #5f6d5f;
  --gold:       #ca711f;
  --gold2:      #de8225;
  --gold-light: rgba(202, 113, 31,.15);
  --gold-glow:  rgba(202, 113, 31,.25);
  --text:       #606060;
  --text2:      #7a7a7a;
  --muted:      #9a9a9a;
  --surface:    #ffffff;
  --surface2:   #f5f3f2;
  --border:     rgba(96,96,96,.10);
  --border2:    rgba(96,96,96,.20);
  --shadow-sm:  0 1px 4px rgba(96,96,96,.07);
  --shadow:     0 4px 24px rgba(96,96,96,.09);
  --shadow-lg:  0 16px 64px rgba(96,96,96,.14);
  --danger-bg:  #fff8f3;
  --danger:     #b84a00;
  --success-bg: #f0faf4;
  --success:    #1a6e3c;
  --radius-sm:  8px;
  --radius:     14px;
  --radius-lg:  20px;
  --container:  960px;
  --pad:        clamp(14px,3vw,28px);
  --hdr-h:      70px;

  /* Animación base (estilo Uiverse TCdesign-dev) */
  --btn-transition: box-shadow .15s, transform .15s;
  --btn-will-change: box-shadow, transform;
}

/* ─── 2. Reset & Base ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; }
body {
  min-height: 100%;
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
  color: var(--text); background: #487b71; overflow-x: hidden;
}
body.no-scroll { overflow: hidden; }

/* ─── 3. Scrollbar ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(72, 123, 113,.22); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(72, 123, 113,.38); }

/* ─── 4. Layout ────────────────────────────────────────────── */
#waveBg {
  background: linear-gradient(135deg, #edecea 0%, #f2f0ee 50%, #e8e5e2 100%);
}

.app { min-height: 100vh; display: flex; flex-direction: column; }
.main-content { flex: 1; }
.container {
  max-width: var(--container); margin: 0 auto;
  padding: clamp(16px,3vw,28px) var(--pad) clamp(28px,5vw,52px);
}

/* ─── 5. Stepper ───────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(72, 123, 113,.97); backdrop-filter: blur(16px);
}
.header-inner {
  max-width: var(--container); margin: 0 auto;
  padding: 0 var(--pad); height: var(--hdr-h);
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; text-decoration: none; }
.brand-logo { width: 36px; height: 36px; flex-shrink: 0; }
.brand-logo svg { width: 36px; height: 36px; }
.brand-text { display: flex; flex-direction: column; gap: 1px; }
.brand-name { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .01em; white-space: nowrap; }
.brand-sub  { font-size: 10px; color: rgba(255,255,255,.45); white-space: nowrap; letter-spacing: .04em; text-transform: uppercase; }

.stepper { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; min-width: 0; overflow: visible; }
.step-node {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border: none; background: transparent; cursor: pointer;
  color: rgba(255,255,255,.38); font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500;
  white-space: nowrap; flex-shrink: 0; transition: color .15s; position: relative;
}
.step-node:hover:not(.is-disabled) { color: rgba(255,255,255,.72); }
.step-node.is-disabled { cursor: not-allowed; pointer-events: none; }
.node-circle {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06);
  flex-shrink: 0; transition: background .2s, border-color .2s; position: relative;
}
.node-ico { width: 14px; height: 14px; fill: currentColor; position: absolute; opacity: 1; transition: opacity .2s; }
.node-num { font-size: 11px; font-weight: 700; position: absolute; opacity: 0; transition: opacity .2s; }
.step-node.is-active .node-circle { background: var(--gold); border-color: var(--gold); color: var(--navy); }
.step-node.is-active .node-ico    { opacity: 0; }
.step-node.is-active .node-num    { opacity: 1; color: var(--navy); }
.step-node.is-active              { color: var(--gold); }
.step-node.is-done .node-circle   { background: rgba(202, 113, 31,.18); border-color: var(--gold); }
.step-node.is-done .node-ico      { opacity: 0; }
.step-node.is-done .node-num      { opacity: 1; color: var(--gold); }
.step-node.is-done                { color: rgba(255,255,255,.6); }
.node-label { font-size: 11px; letter-spacing: .02em; }
@media(max-width:850px) { .node-label { display: none; } .step-node { padding: 6px 7px; } }

.step-connector {
  height: 1px; flex: 1; min-width: 12px; max-width: 40px;
  background: rgba(255,255,255,.12); transition: background .3s; flex-shrink: 1;
}
.step-connector.is-done { background: var(--gold-glow); }
.step-label-wrap {
  flex-shrink: 0;
  display: none;
}
.step-badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(202, 113, 31,.15);
  color: var(--gold);
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px solid rgba(202, 113, 31,.35);
  white-space: nowrap;
  font-family: 'Outfit', sans-serif;
  letter-spacing: .02em;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.step-badge-btn:hover, .step-badge-btn:active {
  background: rgba(202, 113, 31,.25);
  border-color: var(--gold);
  transform: translateY(-1px);
}
.step-badge-chevron {
  transition: transform .25s ease;
  flex-shrink: 0;
}
.step-badge-btn[aria-expanded="true"] .step-badge-chevron {
  transform: rotate(180deg);
}

/* Modal / Dropdown selector de pasos en móvil */
.mobile-step-menu {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: calc(var(--hdr-h) + 10px);
}
.mobile-step-menu.hidden {
  display: none !important;
}
.mobile-step-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(14, 54, 47, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: fadeInBackdrop .2s ease;
}
.mobile-step-sheet {
  position: relative;
  width: calc(100% - 28px);
  max-width: 390px;
  background: #ffffff;
  border: 1px solid rgba(25, 75, 63,0.15);
  border-radius: 18px;
  box-shadow: 0 20px 48px -10px rgba(14, 54, 47, 0.3);
  padding: 16px;
  z-index: 1;
  animation: slideDownMenu .25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fadeInBackdrop {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideDownMenu {
  from { opacity: 0; transform: translateY(-10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.mobile-step-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.mobile-step-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--navy2);
  text-transform: uppercase;
  letter-spacing: .05em;
  font-family: 'Outfit', sans-serif;
}
.mobile-step-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all .15s ease;
}
.mobile-step-close:hover {
  color: #194b3f;
  background: #e2f0f0;
}
.mobile-step-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mobile-step-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
}
.mobile-step-item:hover:not(.is-disabled) {
  background: #ffffff;
  border-color: var(--navy3);
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
.mobile-step-item.is-active {
  background: linear-gradient(135deg, rgba(202, 113, 31,0.12), rgba(72, 123, 113,0.06));
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold);
}
.mobile-step-item.is-done:not(.is-active) {
  background: #ffffff;
  border-color: rgba(26,110,60,0.35);
}
.mobile-step-item.is-disabled {
  opacity: 0.55;
  cursor: not-allowed;
  pointer-events: none;
  background: #fcfcfc;
  border-color: var(--border);
}
.mobile-step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  background: #ffffff;
  border: 1.5px solid var(--border2);
  color: var(--text2);
  flex-shrink: 0;
  transition: all .15s ease;
}
.mobile-step-item.is-active .mobile-step-num {
  background: var(--gold);
  border-color: var(--gold);
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(202, 113, 31,0.35);
}
.mobile-step-item.is-done:not(.is-active) .mobile-step-num {
  background: rgba(26,110,60,0.12);
  border-color: var(--success);
  color: var(--success);
}
.mobile-step-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.m-step-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--navy2);
}
.mobile-step-item.is-active .m-step-name {
  color: var(--gold);
  font-weight: 700;
}
.m-step-desc {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mobile-step-state {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.m-step-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  font-family: 'Outfit', sans-serif;
  letter-spacing: .02em;
}
.m-step-badge.m-active {
  background: rgba(202, 113, 31,0.18);
  color: var(--gold);
  border: 1px solid rgba(202, 113, 31,0.3);
}
.m-step-badge.m-done {
  background: rgba(26,110,60,0.12);
  color: var(--success);
  border: 1px solid rgba(26,110,60,0.25);
}
.m-step-badge.m-locked {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 6px;
}

@media(max-width: 850px) {
  .stepper {
    display: none !important;
  }
  .step-label-wrap {
    display: flex !important;
    flex: 1;
    justify-content: center;
    align-items: center;
    margin-right: 32px;
  }
}
.progress-track { height: 3px; background: rgba(255,255,255,.08); }
.progress-bar   { height: 100%; background: linear-gradient(90deg,var(--gold),var(--gold2)); transition: width .35s ease; }

/* ─── 6. Step Panel & Panel Intro ──────────────────────────── */
.step-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  padding: clamp(18px,3vw,32px);
}
.panel-intro {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 16px 18px; border-radius: var(--radius);
  background: linear-gradient(135deg,rgba(72, 123, 113,.04),rgba(202, 113, 31,.04));
  border: 1px solid var(--border); margin-bottom: 22px;
}
.panel-intro-icon {
  width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px;
  background: linear-gradient(135deg,rgba(72, 123, 113,.09),rgba(202, 113, 31,.08));
  border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; color: var(--navy2);
}
.panel-intro-icon svg { width: 22px; height: 22px; }
.panel-title  { font-size: clamp(15px,2vw,18px); font-weight: 700; letter-spacing: -.015em; margin-bottom: 4px; }
.panel-desc   { color: var(--text2); font-size: 13.5px; line-height: 1.5; }
.panel-header { margin-bottom: 20px; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px;
  border: 1px solid var(--border2); background: rgba(255,255,255,.9); color: var(--text2); letter-spacing: .02em;
}

/* ─── 7. Sections, Grid, Fields ────────────────────────────── */
.section-title-row,
.contacts-table .contacts-head,
.section-subtitle {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--navy2); padding: 5px 0 8px; margin-bottom: 12px;
  border-bottom: 1px solid rgba(96,96,96,.1);
}
.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--navy2); display: block; margin-bottom: 12px; border: none; padding: 0;
}

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-2 > *, .grid-3 > *, .field { min-width: 0; }
.field-full { grid-column: 1 / -1; }
@media(max-width:620px) {
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr) !important; }
  .grid-2 > *, .grid-3 > *, .field { min-width: 0; max-width: 100%; }
  .field-full { grid-column: auto; }
}

.field      { display: flex; flex-direction: column; gap: 6px; }
.field-hint { font-size: 11.5px; color: var(--muted); margin-top: -2px; }
label       { font-size: 13.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 4px; }
.req        { color: #c0392b; font-size: 14px; line-height: 1; }
.sr-only    { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ─── 8. Inputs, Select, Textarea ──────────────────────────── */
.input-wrap {
  position: relative; display: flex; align-items: center;
}
.input-wrap.compact input { padding: 8px 12px; font-size: 13px; border-radius: 10px; height: auto; }
.input-ico {
  position: absolute; left: 12px;
  width: 17px; height: 17px;
  color: var(--muted); pointer-events: none; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.input-ico svg { width: 17px; height: 17px; display: block; vertical-align: middle; }

input, select, textarea {
  width: 100%; padding: 11px 14px 11px 40px;
  border-radius: var(--radius-sm); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 14px;
  outline: none; appearance: none; -webkit-appearance: none;
  transition: border-color .14s, box-shadow .14s, background .14s;
  height: 44px; line-height: 1.4;
}
.input-wrap.compact input { padding-left: 12px; height: auto; }
input:focus, select:focus, textarea:focus {
  border-color: var(--navy3);
  box-shadow: 0 0 0 3px rgba(25, 75, 63,.10);
  background: #fff;
}
input[type="date"]   { cursor: pointer; }
textarea             { padding-top: 10px; resize: vertical; min-height: 80px; line-height: 1.5; height: auto; }
input::placeholder, textarea::placeholder { color: var(--muted); font-weight: 400; }
input.input-error    { border-color: #e53e3e !important; background: #fff5f5; }

/* Campos bloqueados / solo lectura (Razón Social, NIT, Fecha de diligenciamiento) */
input[readonly],
.locked-date,
input.locked {
  background: #e6efee !important;
  color: #34564F !important;
  border-color: rgba(72, 123, 113, 0.25) !important;
  cursor: not-allowed !important;
  user-select: none;
  font-weight: 500;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04) !important;
}

input[readonly]::placeholder,
.locked-date::placeholder,
input.locked::placeholder {
  color: #7a9c96 !important;
  font-style: italic;
}

input[readonly]:focus,
.locked-date:focus,
input.locked:focus {
  outline: none !important;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04) !important;
  border-color: rgba(72, 123, 113, 0.25) !important;
  background: #e6efee !important;
}

.locked-date::selection,
input[readonly]::selection {
  background: transparent;
}

.input-wrap:has(input[readonly]),
.input-wrap:has(.locked-date),
.input-wrap:has(input.locked) {
  cursor: not-allowed;
}

.input-wrap:has(input[readonly]) .input-ico,
.input-wrap:has(.locked-date) .input-ico,
.input-wrap:has(input.locked) .input-ico {
  color: #7a9c96;
}

/* Policy link */
.policy-link { display: inline-flex; align-items: center; gap: 5px; color: var(--gold); font-weight: 600; font-size: 12.5px; text-decoration: none; transition: color .15s; margin-top: 8px; }
.policy-link:hover { color: var(--gold2); text-decoration: underline; }
.policy-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── 9. Phone Prefix ──────────────────────────────────────── */
.phone-wrap {
  display: flex; align-items: stretch;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface2); overflow: hidden;
  transition: border-color .14s, box-shadow .14s, background .14s;
  height: 44px;
}
.phone-wrap:focus-within {
  border-color: var(--navy3);
  box-shadow: 0 0 0 3px rgba(25, 75, 63,.10);
  background: #fff;
}
.phone-prefix {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px 0 12px;
  background: rgba(14, 54, 47,.05); border-right: 1px solid var(--border2);
  white-space: nowrap; flex-shrink: 0;
}
.phone-prefix svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; display: block; }
.phone-prefix-input {
  width: 45px; max-width: 45px; min-width: 45px;
  border: none !important; background: transparent !important; box-shadow: none !important; outline: none !important;
  padding: 0 !important; margin: 0 !important;
  font-size: 14px; font-weight: 600; color: var(--text2); text-align: left;
}
.phone-prefix-input::placeholder { color: var(--muted); }
.phone-input {
  border: none !important; background: transparent !important; box-shadow: none !important;
  border-radius: 0 !important; height: 100% !important; flex: 1; padding-left: 10px !important;
}
.phone-input:focus { border: none !important; box-shadow: none !important; background: transparent !important; }

/* ─── 10. Custom Select (csel) ─────────────────────────────── */
.csel-wrap { position: relative; user-select: none; }
.csel-trigger {
  width: 100%; padding: 11px 38px 11px 40px;
  border-radius: var(--radius-sm); border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 14px;
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  transition: var(--btn-transition); min-height: 44px;
  box-shadow: none;
  will-change: var(--btn-will-change);
}
.csel-trigger:hover {
  border-color: var(--navy3); background: #fff;
  box-shadow:
    rgba(72, 123, 113,.18) 0 4px 8px,
    rgba(72, 123, 113,.12) 0 7px 13px -3px;
  transform: translateY(-1px);
}
.csel-trigger:focus, .csel-wrap.open .csel-trigger {
  border-color: var(--navy3); outline: none; background: #fff;
  box-shadow:
    rgba(72, 123, 113,.15) 0 0 0 1.5px inset,
    rgba(72, 123, 113,.20) 0 2px 4px,
    rgba(72, 123, 113,.12) 0 7px 13px -3px,
    rgba(96,96,96,.10) 0 -2px 0 inset;
  transform: none;
}
.csel-trigger:active {
  box-shadow: rgba(96,96,96,.15) 0 3px 7px inset;
  transform: translateY(1px);
}
.csel-ico { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; display: flex; align-items: center; justify-content: center; }
.csel-ico svg { width: 17px; height: 17px; }
.csel-val   { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.csel-val-stack { flex: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.csel-val-sub   { font-size: 10.5px; color: var(--muted); font-family: 'DM Mono', monospace; line-height: 1.2; margin-top: 1px; }
.csel-arrow { position: absolute; right: 12px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; transition: transform .15s; }
.csel-wrap.open .csel-arrow { transform: rotate(180deg); }

.csel-dropdown {
  position: absolute; left: 0; right: 0; z-index: 500;
  background: #fff; border: 1px solid var(--border2); border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(14, 54, 47,.15);
  max-height: 240px; overflow: hidden; display: none;
}
.csel-wrap.open .csel-dropdown       { display: flex; flex-direction: column; }
.csel-wrap.open.open-down .csel-dropdown { top: calc(100% + 6px); bottom: auto; }
.csel-wrap.open.open-up .csel-dropdown   { bottom: calc(100% + 6px); top: auto; }
.csel-wrap.open:not(.open-up):not(.open-down) .csel-dropdown { top: calc(100% + 6px); }

.csel-search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.csel-search {
  width: 100%; padding: 7px 10px; padding-left: 10px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); font-size: 13px; font-family: 'Outfit', sans-serif; height: auto;
}
.csel-search:focus { border-color: var(--navy3); outline: none; background: #fff; box-shadow: none; }
.csel-list { overflow-y: auto; max-height: 185px; }
.csel-opt {
  padding: 9px 14px; font-size: 13.5px; cursor: pointer;
  transition: background .1s; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csel-opt:hover    { background: rgba(14, 54, 47,.05); }
.csel-opt.selected { background: rgba(14, 54, 47,.07); color: var(--navy2); font-weight: 600; }
.csel-opt.hidden   { display: none; }
.csel-opt-sub      { font-size: 11px; color: var(--muted); display: block; margin-top: 1px; font-family: 'DM Mono', monospace; }

/* ─── 11. Tipo Solicitud Cards ─────────────────────────────── */
fieldset.fieldset-block { border: none; padding: 0; margin-bottom: 18px; }
.tipo-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
@media(max-width:780px) { .tipo-grid { grid-template-columns: repeat(2,1fr); } }
@media(max-width:480px) { .tipo-grid { grid-template-columns: 1fr; } }

.tipo-card {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px;
  border: 1.5px solid var(--border2); border-radius: var(--radius);
  background: var(--surface2); cursor: pointer; user-select: none;
  transition: var(--btn-transition), border-color .15s, background .15s;
  will-change: var(--btn-will-change);
  box-shadow:
    rgba(96,96,96,.08) 0 2px 4px,
    rgba(96,96,96,.05) 0 7px 13px -3px,
    rgba(96,96,96,.08) 0 -2px 0 inset;
}
.tipo-card:hover {
  border-color: var(--navy3); background: #fff;
  box-shadow:
    rgba(72, 123, 113,.15) 0 4px 8px,
    rgba(72, 123, 113,.10) 0 7px 13px -3px,
    rgba(96,96,96,.08) 0 -2px 0 inset;
  transform: translateY(-2px);
}
.tipo-card.selected {
  border-color: var(--navy2);
  background: rgba(72, 123, 113,.04);
  box-shadow:
    rgba(72, 123, 113,.20) 0 0 0 1.5px inset,
    rgba(72, 123, 113,.15) 0 2px 4px,
    rgba(72, 123, 113,.10) 0 7px 13px -3px;
  transform: none;
}
.tipo-card:active:not(.selected) {
  box-shadow: rgba(96,96,96,.15) 0 3px 7px inset;
  transform: translateY(2px);
}
.tipo-card:focus { outline: 2px solid var(--navy2); outline-offset: 2px; }

.tipo-icon { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: rgba(72, 123, 113,.07); display: flex; align-items: center; justify-content: center; color: var(--navy2); }
.tipo-icon svg { width: 16px; height: 16px; }
.tipo-info { flex: 1; min-width: 0; }
.tipo-info strong { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.tipo-info span   { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.tipo-check {
  width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%;
  border: 1.5px solid var(--border2); background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: transparent; transition: background .15s, border-color .15s, color .15s; margin-top: 2px;
}
.tipo-check svg { width: 10px; height: 10px; }
.tipo-card.selected .tipo-check { background: var(--navy2); border-color: var(--navy2); color: #fff; }
.tipo-card.selected .tipo-icon  { background: rgba(72, 123, 113,.12); }

/* ─── 12. Centros Multi-select ─────────────────────────────── */
.centros-wrap {
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  overflow: hidden;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.centros-search-wrap {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  background: #fff; display: flex; align-items: center; gap: 8px;
  width: 100%; max-width: 100%; box-sizing: border-box;
}
.centros-search {
  flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); font-size: 13px; font-family: 'Outfit', sans-serif; height: auto;
  box-sizing: border-box;
}
.centros-search:focus { border-color: var(--navy3); outline: none; background: #fff; box-shadow: none; }

.centros-select-all-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.btn-centros-all {
  height: 32px; display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text2); font-family: inherit; font-size: 11.5px; font-weight: 600;
  cursor: pointer; padding: 0 10px; white-space: nowrap;
  transition: var(--btn-transition);
  box-shadow: rgba(96,96,96,.08) 0 1px 3px, rgba(96,96,96,.06) 0 -1px 0 inset;
  will-change: var(--btn-will-change);
  box-sizing: border-box;
}
.btn-centros-all:hover {
  border-color: var(--navy3); background: var(--surface2); color: var(--navy2);
  box-shadow: rgba(72, 123, 113,.15) 0 3px 6px, rgba(96,96,96,.06) 0 -1px 0 inset;
  transform: translateY(-1px);
}
.btn-centros-all:active {
  box-shadow: rgba(96,96,96,.15) 0 2px 5px inset;
  transform: translateY(1px);
}
.btn-centros-all svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.centros-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  max-height: 260px; overflow-y: auto; padding: 8px;
  width: 100%; max-width: 100%; box-sizing: border-box;
}
@media(max-width:580px) {
  .centros-grid {
    grid-template-columns: minmax(0, 1fr);
    padding: 6px;
  }
}
@media(max-width:480px) {
  .centros-search-wrap {
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px;
  }
  .centros-search {
    width: 100%;
    flex: 1 1 100%;
  }
  .centros-select-all-wrap {
    width: 100%;
    justify-content: flex-end;
  }
  .btn-centros-all {
    flex: 1;
    justify-content: center;
  }
}

.centro-check-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px;
  border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: #fff;
  cursor: pointer; user-select: none;
  transition: var(--btn-transition), border-color .12s, background .12s;
  box-shadow: rgba(96,96,96,.06) 0 1px 3px, rgba(96,96,96,.05) 0 -1px 0 inset;
  will-change: var(--btn-will-change);
  min-width: 0; max-width: 100%; box-sizing: border-box;
}
.centro-check-item:hover {
  border-color: var(--navy3); background: rgba(14, 54, 47,.02);
  box-shadow: rgba(72, 123, 113,.12) 0 3px 7px, rgba(96,96,96,.05) 0 -1px 0 inset;
  transform: translateY(-1px);
}
.centro-check-item:active {
  box-shadow: rgba(96,96,96,.12) 0 2px 5px inset;
  transform: translateY(1px);
}
.centro-check-item.checked {
  border-color: var(--navy2);
  background: linear-gradient(135deg,rgba(72, 123, 113,.04),rgba(202, 113, 31,.04));
  box-shadow:
    rgba(72, 123, 113,.15) 0 0 0 1px inset,
    rgba(72, 123, 113,.10) 0 2px 4px;
  transform: none;
}
.centro-check-item.hidden  { display: none; }
.centro-check-item:focus   { outline: 2px solid var(--navy2); outline-offset: 2px; }

.centro-check-box {
  width: 17px; height: 17px; flex-shrink: 0; border-radius: 5px;
  border: 1.5px solid rgba(96,96,96,.3); background: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s; color: transparent;
}
.centro-check-box svg { width: 10px; height: 10px; display: block; }
.centro-check-item.checked .centro-check-box { background: var(--navy2); border-color: var(--navy2); color: #fff; }
.centro-check-label { flex: 1; min-width: 0; }
.centro-check-name  { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.centro-check-nit   { font-size: 11px; color: var(--muted); font-family: 'Outfit', sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }

.centros-tags {
  display: none !important;
}
.centro-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px;
  background: rgba(72, 123, 113,.09); color: var(--navy2); font-size: 11.5px; font-weight: 600;
  border: 1px solid rgba(72, 123, 113,.18);
}
.centro-tag-remove {
  display: flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%; background: rgba(72, 123, 113,.15);
  color: var(--navy2); cursor: pointer; border: none; font-size: 10px; line-height: 1;
  transition: background .12s; padding: 0;
}
.centro-tag-remove:hover { background: rgba(184,74,0,.18); color: #b84a00; }
.centros-placeholder { color: var(--muted); font-size: 12px; font-style: italic; }
.centros-all-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; color: var(--navy2); flex: 1;
}

/* ─── 13. Monto ────────────────────────────────────────────── */
.monto-ejecutivo-grid { align-items: start; }
.monto-field          { position: relative; }
.monto-input-wrap {
  display: flex; align-items: stretch;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface2); overflow: hidden;
  transition: border-color .14s, background .14s;
  height: 44px;
}
.monto-input-wrap:focus-within {
  border-color: var(--navy3);
  box-shadow: 0 0 0 3px rgba(25, 75, 63,.10);
  background: #fff;
}
.monto-currency {
  display: flex; align-items: center; justify-content: center;
  min-width: 62px; padding: 0 12px;
  border-right: 1px solid var(--border2);
  background: rgba(14, 54, 47,.05);
  color: var(--text2); font-size: 13px; font-weight: 700; flex-shrink: 0;
  height: 100%;
}
.monto-input-wrap input {
  border: none !important; background: transparent !important;
  box-shadow: none !important; border-radius: 0 !important;
  height: 100% !important; flex: 1; padding-left: 12px !important;
  outline: none !important;
}
.monto-input-wrap input:focus {
  border: none !important; box-shadow: none !important; background: transparent !important;
}

.monto-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 120;
  background: #fff; border: 1px solid var(--border2); border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(14, 54, 47,.15);
  max-height: 240px; overflow: hidden; display: none;
  flex-direction: column;
}
.monto-dropdown:not(.hidden) { display: flex; }

.monto-option {
  width: 100%; padding: 9px 14px; border: none; background: transparent;
  color: var(--text); font-family: 'Outfit', sans-serif; font-size: 13.5px;
  font-weight: 400; cursor: pointer; text-align: left;
  transition: background .1s, color .1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.monto-option:hover { background: rgba(14, 54, 47,.05); color: var(--navy2); }

/* ─── 14. Responsabilidad Fiscal ───────────────────────────── */
.fiscal-grid { display: flex; flex-direction: column; gap: 6px; }
.fiscal-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2);
  cursor: pointer; user-select: none;
  transition: var(--btn-transition), background .12s, border-color .12s;
  box-shadow: rgba(96,96,96,.06) 0 1px 3px, rgba(96,96,96,.06) 0 -1px 0 inset;
  will-change: var(--btn-will-change);
}
.fiscal-row:hover {
  background: #fff; border-color: var(--border2);
  box-shadow: rgba(72, 123, 113,.12) 0 3px 7px, rgba(96,96,96,.06) 0 -1px 0 inset;
  transform: translateY(-1px);
}
.fiscal-row:active {
  box-shadow: rgba(96,96,96,.12) 0 2px 5px inset;
  transform: translateY(1px);
}
.fiscal-row:has(input:checked) {
  background: rgba(72, 123, 113,.05); border-color: rgba(72, 123, 113,.2);
  box-shadow: rgba(72, 123, 113,.15) 0 0 0 1px inset, rgba(72, 123, 113,.08) 0 2px 4px;
  transform: none;
}
.fiscal-row:focus { outline: 2px solid var(--navy2); outline-offset: 2px; }
.fiscal-row.is-disabled       { opacity: .55; cursor: not-allowed; }
.fiscal-row.is-disabled:hover { background: var(--surface2); border-color: var(--border); box-shadow: none; transform: none; }

.fiscal-row input[type="checkbox"] { display: none; }
.fiscal-code {
  font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace;
  background: rgba(72, 123, 113,.08); color: var(--navy2);
  padding: 3px 8px; border-radius: 5px; flex-shrink: 0; min-width: 64px; text-align: center;
}
.fiscal-row span:last-child { font-size: 13px; font-weight: 500; }
.fiscal-row::after {
  content: ""; margin-left: auto; width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid rgba(25, 59, 56,.25); background: transparent; flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.fiscal-row:has(input:checked)::after {
  border-color: var(--navy2); background: var(--navy2);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13.5 4.5 6 12 2.5 8.5' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E");
  background-size: 10px; background-repeat: no-repeat; background-position: center;
}

/* ─── 15. Contacts Table ───────────────────────────────────── */
.contacts-table { display: flex; flex-direction: column; gap: 6px; }
.contacts-head  {
  display: grid; grid-template-columns: 140px 1fr 1fr 1fr; gap: 8px;
  padding: 0 4px 6px; font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border);
}
.contacts-row {
  display: grid; grid-template-columns: 140px 1fr 1fr 1fr; gap: 8px;
  align-items: center; padding: 8px 10px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2);
  transition: background .12s;
}
.contacts-row:hover { background: #fff; }
.area-label { font-size: 12px; font-weight: 700; color: var(--text); }
@media(max-width:820px) {
  .contacts-head { display: none; }
  .contacts-row  { grid-template-columns: 1fr; gap: 5px; padding: 10px; }
  .area-label    { font-size: 13px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
}

/* ─── 16. Radio Buttons ────────────────────────────────────── */
.radio-row  { display: flex; gap: 10px; flex-wrap: wrap; }
.radio-item {
  display: flex; align-items: center; gap: 7px; padding: 8px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2);
  cursor: pointer; font-size: 13px; font-weight: 600; user-select: none;
  transition: var(--btn-transition), background .12s, border-color .12s;
  box-shadow: rgba(96,96,96,.07) 0 2px 4px, rgba(96,96,96,.06) 0 -2px 0 inset;
  will-change: var(--btn-will-change);
}
.radio-item:hover {
  background: #fff; border-color: var(--navy3);
  box-shadow: rgba(72, 123, 113,.15) 0 4px 8px, rgba(96,96,96,.06) 0 -2px 0 inset;
  transform: translateY(-1px);
}
.radio-item:active {
  box-shadow: rgba(96,96,96,.12) 0 2px 5px inset;
  transform: translateY(1px);
}
.radio-item:has(input:checked) {
  border-color: rgba(14, 54, 47,.3); background: rgba(14, 54, 47,.05);
  box-shadow: rgba(72, 123, 113,.15) 0 0 0 1.5px inset, rgba(72, 123, 113,.10) 0 2px 4px;
  transform: none;
}
.radio-item:focus { outline: 2px solid var(--navy2); outline-offset: 2px; }
.radio-item input[type="radio"] { display: none; }
.radio-box {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid rgba(25, 59, 56,.3); background: transparent;
  transition: border-color .15s, box-shadow .15s;
}
.radio-item:has(input:checked) .radio-box {
  border-color: var(--navy2);
  box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px var(--navy2);
}

/* ─── 17. Botones ──────────────────────────────────────────── */
.step-actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.step-actions.split { justify-content: space-between; }
@media(max-width:480px) {
  .step-actions.split { flex-direction: column-reverse; }
  .step-actions .btn  { width: 100%; justify-content: center; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; position: relative; overflow: hidden;
  text-decoration: none; box-sizing: border-box;
  transition: var(--btn-transition);
  will-change: var(--btn-will-change);
  touch-action: manipulation; user-select: none;
}
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn svg      { width: 16px; height: 16px; flex-shrink: 0; }

/* Outline */
.btn-outline {
  border: 1px solid var(--border2); background: var(--surface); color: var(--text2);
  box-shadow:
    rgba(96,96,96,.12) 0 2px 4px,
    rgba(96,96,96,.08) 0 7px 13px -3px,
    rgba(96,96,96,.12) 0 -3px 0 inset;
}
.btn-outline:focus {
  box-shadow:
    rgba(96,96,96,.15) 0 0 0 1.5px inset,
    rgba(96,96,96,.18) 0 2px 4px,
    rgba(96,96,96,.12) 0 7px 13px -3px,
    rgba(96,96,96,.12) 0 -3px 0 inset;
}
.btn-outline:hover:not(:disabled) {
  border-color: var(--navy3); color: var(--navy2);
  box-shadow:
    rgba(72, 123, 113,.20) 0 4px 8px,
    rgba(72, 123, 113,.14) 0 7px 13px -3px,
    rgba(96,96,96,.12) 0 -3px 0 inset;
  transform: translateY(-2px);
}
.btn-outline:active:not(:disabled) {
  box-shadow: rgba(96,96,96,.18) 0 3px 7px inset;
  transform: translateY(2px);
}

/* Primary */
.btn-primary {
  border: none; color: #fff; background: var(--navy2);
  box-shadow:
    rgba(72, 123, 113,.30) 0 2px 4px,
    rgba(72, 123, 113,.20) 0 7px 13px -3px,
    rgba(29, 76, 70,.30) 0 -3px 0 inset;
}
.btn-primary:focus {
  box-shadow:
    rgba(72, 123, 113,.35) 0 0 0 1.5px inset,
    rgba(72, 123, 113,.35) 0 2px 4px,
    rgba(72, 123, 113,.25) 0 7px 13px -3px,
    rgba(29, 76, 70,.30) 0 -3px 0 inset;
}
.btn-primary:hover:not(:disabled) {
  background: var(--navy);
  box-shadow:
    rgba(72, 123, 113,.40) 0 4px 8px,
    rgba(72, 123, 113,.28) 0 7px 13px -3px,
    rgba(29, 76, 70,.30) 0 -3px 0 inset;
  transform: translateY(-2px);
}
.btn-primary:active:not(:disabled) {
  box-shadow: rgba(29, 76, 70,.35) 0 3px 7px inset;
  transform: translateY(2px);
}

/* Submit / Gold */
.btn-submit {
  border: none; color: var(--navy); background: var(--gold);
  box-shadow:
    rgba(202, 113, 31,.35) 0 2px 4px,
    rgba(202, 113, 31,.25) 0 7px 13px -3px,
    rgba(147, 77, 13,.30) 0 -3px 0 inset;
}
.btn-submit:focus {
  box-shadow:
    rgba(202, 113, 31,.40) 0 0 0 1.5px inset,
    rgba(202, 113, 31,.40) 0 2px 4px,
    rgba(202, 113, 31,.30) 0 7px 13px -3px,
    rgba(147, 77, 13,.30) 0 -3px 0 inset;
}
.btn-submit:hover:not(:disabled) {
  background: var(--gold2);
  box-shadow:
    rgba(202, 113, 31,.48) 0 4px 8px,
    rgba(202, 113, 31,.32) 0 7px 13px -3px,
    rgba(147, 77, 13,.30) 0 -3px 0 inset;
  transform: translateY(-2px);
}
.btn-submit:active:not(:disabled) {
  box-shadow: rgba(147, 77, 13,.35) 0 3px 7px inset;
  transform: translateY(2px);
}

/* Botones auxiliares */
.btn-add-cc {
  background: none; border: 1.5px dashed #afc6c0; color: #3c6c62;
  font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
  cursor: pointer; transition: border-color .2s, color .2s; font-family: inherit;
}
.btn-add-cc:hover { border-color: #3c6c62; }

.btn-file {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px;
  border-radius: 9px; border: 1px solid var(--border2); background: var(--surface);
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; color: var(--text2); white-space: nowrap;
  transition: var(--btn-transition);
  box-shadow: rgba(96,96,96,.10) 0 1px 3px, rgba(96,96,96,.08) 0 -2px 0 inset;
  will-change: var(--btn-will-change);
}
.btn-file:hover {
  border-color: var(--navy3);
  box-shadow: rgba(72, 123, 113,.15) 0 3px 6px, rgba(96,96,96,.08) 0 -2px 0 inset;
  transform: translateY(-1px);
}
.btn-file:active {
  box-shadow: rgba(96,96,96,.14) 0 2px 5px inset;
  transform: translateY(1px);
}
.btn-file svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn-remove-doc {
  background: none; border: none; color: #999; font-size: 1rem;
  cursor: pointer; margin-left: 8px; padding: 4px 6px; border-radius: 4px; transition: color .15s;
}
.btn-remove-doc:hover { color: #e53e3e; }

.btn-ref-remove {
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid rgba(184,74,0,.2); background: rgba(184,74,0,.06); color: #b84a00;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s; flex-shrink: 0;
}
.btn-ref-remove:hover { background: rgba(184,74,0,.14); }
.btn-ref-remove svg   { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.btn-ref-add {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
  border-radius: var(--radius-sm); border: 1px dashed var(--border2);
  background: transparent; color: var(--text2); font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: border-color .12s, background .12s; margin-top: 4px;
}
.btn-ref-add:hover { border-color: var(--navy3); background: rgba(14, 54, 47,.03); }
.btn-ref-add svg   { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.btn-add-doc-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 80px; border: 1.5px dashed var(--border2) !important;
  border-radius: var(--radius-sm); background: var(--surface);
  transition: var(--btn-transition), border-color .15s;
  box-shadow: rgba(96,96,96,.06) 0 1px 3px;
  will-change: var(--btn-will-change);
}
.btn-add-doc-wrap:hover {
  border-color: var(--navy3) !important;
  box-shadow: rgba(72, 123, 113,.12) 0 3px 8px;
  transform: translateY(-1px);
}
.btn-add-doc-wrap:active { transform: translateY(1px); box-shadow: rgba(96,96,96,.12) 0 2px 5px inset; }
.btn-add-doc {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; min-height: 72px;
  background: none; border: none; color: var(--text2);
  border-radius: var(--radius-sm); padding: 10px 18px;
  font-size: .88rem; font-weight: 500; font-family: inherit; cursor: pointer;
}

.btn-add-cc {
  background: none; border: 1.5px dashed var(--border2); color: var(--navy3);
  font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px;
  cursor: pointer; font-family: inherit;
  transition: var(--btn-transition), border-color .15s, color .15s;
  box-shadow: rgba(96,96,96,.06) 0 1px 3px;
  will-change: var(--btn-will-change);
}
.btn-add-cc:hover {
  border-color: var(--navy3); color: var(--navy2);
  box-shadow: rgba(72, 123, 113,.12) 0 3px 8px;
  transform: translateY(-1px);
}
.btn-add-cc:active { transform: translateY(1px); box-shadow: rgba(96,96,96,.12) 0 2px 5px inset; }

/* ─── 18. Documentos ───────────────────────────────────────── */
.docs-alert {
  display: flex; align-items: flex-start; gap: 8px; padding: 10px 13px;
  border-radius: var(--radius-sm); background: rgba(202, 113, 31,.08);
  border: 1px solid rgba(202, 113, 31,.25); font-size: 13px; color: #7a4400; font-weight: 500; margin-bottom: 16px;
}
.docs-alert svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; fill: currentColor; }

.docs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width:640px) { .docs-grid { grid-template-columns: 1fr; } }

.doc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 13px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow-sm); transition: box-shadow .15s; position: relative;
}
.doc-card:hover { box-shadow: var(--shadow); }

.doc-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; }
.doc-left     { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.doc-icon     {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;
  background: linear-gradient(135deg,rgba(72, 123, 113,.08),rgba(202, 113, 31,.06));
  border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; color: var(--navy2);
}
.doc-icon svg { width: 16px; height: 16px; display: block; }
.doc-meta     { flex: 1; min-width: 0; }

/* EEFF card fixed height */
#docCard_ESTADOS_FIN .doc-meta { min-height: unset; }
#docCard_ESTADOS_FIN .doc-sub  { min-height: 32px; }
#docCard_ESTADOS_FIN .doc-name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 34px;
}

.doc-name {
  font-size: 12.5px; font-weight: 700; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; color: var(--text);
}
.doc-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.doc-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; letter-spacing: .03em; }
.doc-badge.required { background: rgba(184,74,0,.10); color: #b84a00; border: 1px solid rgba(184,74,0,.2); }
.doc-badge.optional { background: rgba(26,110,60,.08); color: var(--success); border: 1px solid rgba(26,110,60,.2); }
.doc-file-name {
  font-size: 11px; color: var(--navy3); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 130px; margin-top: 2px; font-family: 'DM Mono', monospace;
}
.doc-actions   { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }
.doc-status    {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--border2);
  background: var(--surface2); color: var(--muted); white-space: nowrap;
}
.doc-status.ok { background: var(--success-bg); color: var(--success); border-color: rgba(26,110,60,.25); }
.doc-status svg { width: 11px; height: 11px; fill: currentColor; }
.doc-hint { font-size: 11px; color: var(--muted); }

.file-pick-wrap { position: relative; display: inline-flex; }
.file-pick-wrap input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

.doc-comment-wrap { padding-top: 4px; }
.doc-comment {
  width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); font-size: 12px; font-family: 'Outfit', sans-serif;
  color: var(--text); resize: none; min-height: 50px; line-height: 1.4; height: auto;
  transition: border-color .14s;
}
.doc-comment:focus    { border-color: var(--navy3); outline: none; background: #fff; box-shadow: 0 0 0 2px rgba(25, 75, 63,.08); }
.doc-comment::placeholder { color: var(--muted); }

.docs-adicionales-container { grid-column: 1 / -1; display: contents; }
.docs-add-wrap { grid-column: 1 / -1; display: flex; justify-content: flex-start; padding: 4px 0; }

#docFileName_ESTADOS_FIN { display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 180px; }

.eeff-file-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; color: var(--navy3); font-weight: 600;
  font-family: 'DM Mono', monospace; background: rgba(72, 123, 113,.07);
  border-radius: 5px; padding: 2px 5px; width: 100%; min-width: 0;
}
.eeff-file-item span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.eeff-file-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 10px; padding: 0; line-height: 1; flex-shrink: 0; transition: color .12s; }
.eeff-file-remove:hover { color: #b84a00; }

@media(max-width:640px) {
  .doc-card-top { flex-wrap: wrap; gap: 8px; }
  .doc-left     { flex: 1 1 100%; min-width: 0; }
  .doc-actions  {
    flex: 1 1 100% !important; flex-shrink: 1 !important; max-width: 100% !important;
    justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); flex-wrap: nowrap;
  }
  .btn-file    { flex: 1; justify-content: center; }
  .doc-status  { flex-shrink: 0; }
  .btn-remove-doc { position: absolute; top: 10px; right: 10px; margin-left: 0; }
}

/* ─── 19. Date Picker ──────────────────────────────────────── */
.doc-vig-wrap {
  padding: 12px 16px; background: #f8fbfb; border-top: 1px solid #dcf6f5;
  border-radius: 0 0 12px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.doc-vig-label { font-size: 13px; font-weight: 600; color: #3c6c62; white-space: nowrap; flex-shrink: 0; }

.dtp-wrap    { position: relative; display: inline-block; }
.dtp-trigger {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  border: 1.5px solid #ddeaea; border-radius: 8px; background: #fff;
  font-family: inherit; font-size: 13px; color: #3c6c62;
  cursor: pointer; min-width: 148px; user-select: none;
  transition: var(--btn-transition);
  box-shadow: rgba(72, 123, 113,.08) 0 2px 4px, rgba(72, 123, 113,.06) 0 -2px 0 inset;
  will-change: var(--btn-will-change);
}
.dtp-trigger:hover {
  border-color: #3c6c62;
  box-shadow: rgba(72, 123, 113,.15) 0 4px 8px, rgba(72, 123, 113,.06) 0 -2px 0 inset;
  transform: translateY(-1px);
}
.dtp-trigger:active {
  box-shadow: rgba(72, 123, 113,.14) 0 2px 5px inset;
  transform: translateY(1px);
}
.dtp-trigger.input-error { border-color: #e53935; }
.dtp-trigger svg         { flex-shrink: 0; }
.dtp-placeholder         { color: #99c3be; }

.dtp-panel {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
  background: #fff; border: 1.5px solid #dcf6f5; border-radius: 12px;
  box-shadow: 0 8px 32px rgba(72, 123, 113,.13); padding: 14px; min-width: 260px; display: none;
}
.dtp-panel.open { display: block; }

.dtp-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dtp-nav-btn {
  background: none; border: none; cursor: pointer; padding: 4px 8px;
  border-radius: 6px; color: #3c6c62; font-size: 16px; line-height: 1; transition: background .15s;
}
.dtp-nav-btn:hover    { background: #eefbfb; }
.dtp-nav-btn:disabled { opacity: .3; cursor: default; }
.dtp-month-year {
  font-size: 14px; font-weight: 700; color: #3c6c62;
  cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background .15s;
}
.dtp-month-year:hover { background: #eefbfb; }

.dtp-dow-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 4px; }
.dtp-dow     { text-align: center; font-size: 11px; font-weight: 700; color: #79a9a0; padding: 2px 0; }
.dtp-days    { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.dtp-day {
  text-align: center; padding: 6px 2px; border-radius: 6px; font-size: 13px;
  cursor: pointer; color: #3c6c62; border: none; background: none;
  font-family: inherit; transition: background .15s, color .15s;
}
.dtp-day.today        { font-weight: 700; color: #487b71; }
.dtp-day.selected     { background: #3c6c62; color: #fff; border-radius: 6px; }
.dtp-day.selected:hover { background: #3c6c62; }
.dtp-day:hover:not(:disabled) { background: #eefbfb; }
.dtp-day:disabled     { color: #c4ddd8; cursor: default; }
.dtp-day.other-month  { color: #afd5d0; }
.dtp-clear {
  margin-top: 10px; width: 100%; background: none; border: 1.5px solid #dcf6f5;
  border-radius: 7px; padding: 6px; font-family: inherit; font-size: 12px;
  color: #79a9a0; cursor: pointer; transition: border-color .2s, color .2s;
}
.dtp-clear:hover { border-color: #e53935; color: #e53935; }

.doc-vigencia-error  { font-size: 12px; color: #e53935; margin-top: 4px; width: 100%; }
.field-inline-error  { font-size: 11px; color: #e53935; margin-top: 3px; }
.field-tooltip-error {
  position: absolute; top: 50%; left: calc(100% + 8px); transform: translateY(-50%);
  background: #3c6c62; color: #fff; font-size: 11.5px; padding: 5px 10px;
  border-radius: 7px; white-space: nowrap; z-index: 100; pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
.field-tooltip-error::before {
  content: ''; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
  border: 5px solid transparent; border-right-color: #3c6c62;
}

/* ─── 20. Summary & Terms ──────────────────────────────────── */
.summary-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: var(--surface2); margin-bottom: 18px; }
.sum-section  { margin-bottom: 14px; }
.sum-section:last-child { margin-bottom: 0; }
.sum-section-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sum-item { padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #fff; }
.sum-k    { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-bottom: 2px; letter-spacing: .02em; }
.sum-v { font-weight:600; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; overflow-wrap:break-word; }
@media(max-width:540px) { .sum-grid { grid-template-columns: 1fr; } }
@media(max-width:480px) {
  .sum-v    { white-space: normal; word-break: break-word; }
  .sum-grid { grid-template-columns: 1fr; }
  .summary-card { padding: 12px; }
}

.terms-block  { padding: 13px 15px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); margin-bottom: 12px; }
.terms-title  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--navy2); margin-bottom: 7px; }
.terms-text   { font-size: 12.5px; color: var(--text2); line-height: 1.65; }

.toggle-accept { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; margin-top: 16px; user-select: none; }
.toggle-accept input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; clip: rect(0,0,0,0); }
.toggle-track {
  position: relative; width: 46px; height: 26px; flex-shrink: 0; border-radius: 99px;
  background: rgba(25, 59, 56,.18); border: 1px solid rgba(25, 59, 56,.22);
  transition: background .2s, border-color .2s;
  box-shadow: rgba(25, 59, 56,.10) 0 2px 4px, rgba(25, 59, 56,.08) 0 -2px 0 inset;
}
.toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(14, 54, 47,.25); transition: transform .2s, box-shadow .2s;
}
.toggle-accept:has(input:checked) .toggle-track {
  background: var(--navy2); border-color: var(--navy3);
  box-shadow: rgba(72, 123, 113,.25) 0 2px 4px, rgba(29, 76, 70,.20) 0 -2px 0 inset;
}
.toggle-accept:has(input:checked) .toggle-thumb { transform: translateX(20px); box-shadow: 0 2px 6px rgba(14, 54, 47,.3); }
.toggle-text { font-size: 13px; font-weight: 600; color: var(--text2); line-height: 1.5; margin-top: 3px; }
.toggle-accept input[type="checkbox"]:focus + .toggle-track { outline: 2px solid var(--navy2); outline-offset: 2px; }

/* ─── 21. Modales & Alerts ─────────────────────────────────── */
.alert-box { display: none !important; }
.hidden    { display: none !important; }

.val-modal-overlay {
  position: fixed; inset: 0; z-index: 1200;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(9, 37, 33,.6); backdrop-filter: blur(6px);
  animation: fadeInOvl .18s ease;
}
.val-modal-box {
  width: min(430px,100%); background: #fff; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); overflow: hidden; animation: slideUpBox .2s ease;
}
.val-modal-head {
  background: linear-gradient(135deg,#b84a00,#d45a00);
  padding: 16px 20px 14px; display: flex; align-items: center; gap: 12px;
}
.val-modal-head-ico {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px;
  background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; color: #fff;
}
.val-modal-head-ico svg { width: 18px; height: 18px; fill: currentColor; }
.val-modal-title { font-size: 15px; font-weight: 700; color: #fff; }
.val-modal-body  { padding: 18px 20px 20px; }
.val-modal-msg   { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 16px; }
.val-modal-btn {
  width: 100%; padding: 11px; border-radius: var(--radius-sm); border: none;
  background: var(--navy2); color: #fff;
  font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: var(--btn-transition);
  box-shadow: rgba(72, 123, 113,.30) 0 2px 4px, rgba(29, 76, 70,.30) 0 -3px 0 inset;
  will-change: var(--btn-will-change);
}
.val-modal-btn:hover {
  background: var(--navy);
  box-shadow: rgba(72, 123, 113,.40) 0 4px 8px, rgba(29, 76, 70,.30) 0 -3px 0 inset;
  transform: translateY(-1px);
}
.val-modal-btn:active {
  box-shadow: rgba(29, 76, 70,.35) 0 3px 7px inset;
  transform: translateY(1px);
}

.modal-overlay { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(9, 37, 33,.52); backdrop-filter: blur(6px); }
.modal-box     { width: min(540px,100%); background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-header  { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
.modal-icon    {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: 13px;
  background: linear-gradient(135deg,rgba(72, 123, 113,.1),rgba(202, 113, 31,.08));
  border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; color: var(--navy2);
}
.modal-icon svg  { width: 20px; height: 20px; }
.modal-title     { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.modal-sub       { color: var(--muted); font-size: 13px; }
.modal-body      { padding: 16px 20px; }
.upload-status   { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text2); font-family: 'DM Mono', monospace; }
.modal-footer    { padding: 12px 20px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }

/* Crédito / Policy */
.info-credito       { margin: 18px 0 0; border-radius: var(--radius-sm); overflow: hidden; }
.info-credito-inner {
  padding: 12px 14px;
  background: linear-gradient(135deg,rgba(72, 123, 113,.04),rgba(202, 113, 31,.06));
  border: 1px solid rgba(202, 113, 31,.25); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text2); line-height: 1.6;
}
.info-credito-inner strong { color: var(--navy2); }

/* ─── 22. Skeleton Screens ─────────────────────────────────── */
.sk {
  background: linear-gradient(90deg, #ebebeb 25%, #f5f5f5 50%, #ebebeb 75%);
  background-size: 600px 100%; animation: shimmer 1.4s infinite linear; border-radius: 6px;
}
.sk-text  { height: 14px; border-radius: 4px; }
.sk-title { height: 20px; border-radius: 5px; }
.sk-input { height: 44px; border-radius: var(--radius-sm); }
.sk-card  { height: 80px; border-radius: var(--radius); }

}

#skeletonScreen {

}
.modal-skeleton { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
.modal-sk-row   { display: flex; align-items: center; gap: 10px; }
.modal-sk-icon  { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; }
.modal-sk-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }

#uploadBar {
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 40%, #fdb062 50%, var(--gold2) 60%, var(--gold) 100%);
  background-size: 200px 100%; animation: progress-shine 1.2s infinite linear; transition: width .4s ease;
}

/* ─── 23. EEFF Toggle ──────────────────────────────────────── */
.eeff-toggle-wrap {
  border-top: 1px solid var(--border); padding: 10px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.eeff-toggle-label {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  cursor: pointer; user-select: none;
}
/* Reutiliza .toggle-track y .toggle-thumb — solo añade el hidden input */
.eeff-toggle-track {
  position: relative; width: 46px; height: 26px; flex-shrink: 0; border-radius: 99px;
  background: rgba(25, 59, 56,.18); border: 1px solid rgba(25, 59, 56,.22);
  transition: background .2s, border-color .2s;
  box-shadow: rgba(25, 59, 56,.10) 0 2px 4px, rgba(25, 59, 56,.08) 0 -2px 0 inset;
}
.eeff-toggle-track input { position: absolute; opacity: 0; width: 0; height: 0; }
.eeff-toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(14, 54, 47,.25); transition: transform .2s, box-shadow .2s;
}
.eeff-toggle-thumb::after { display: none; } /* quita el pseudo-elemento anterior */
.eeff-toggle-track input:checked + .eeff-toggle-thumb {
  transform: translateX(20px); box-shadow: 0 2px 6px rgba(14, 54, 47,.3);
}
.eeff-toggle-track:has(input:checked) {
  background: var(--navy2); border-color: var(--navy3);
  box-shadow: rgba(72, 123, 113,.25) 0 2px 4px, rgba(29, 76, 70,.20) 0 -2px 0 inset;
}
.eeff-toggle-hint { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 4px; }

/* ─── 24. Fixed Heights ────────────────────────────────────── */
.field             { min-height: 72px; }
.field:has(.field-hint) { min-height: 90px; }
.field.field-full  { min-height: unset; }
.field:has(.input-error) { position: relative; }

.input-wrap, .phone-wrap, .csel-wrap, .monto-field { min-height: 44px; }

input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]),
select, .csel-trigger, .phone-wrap {
  height: 44px !important; min-height: 44px !important; max-height: 44px !important;
}
textarea {
  height: auto !important; min-height: 96px !important; max-height: unset !important;
}

select {
  box-shadow: none;
}
input:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(25, 75, 63,.10);
}
.phone-wrap {

}

}

.fiscal-row     { min-height: 44px; height: 44px; }
.centro-check-item { min-height: 52px; }
.tipo-card      { min-height: 100px; }
.doc-card       { min-height: 80px; }
/* ─── 22. Skeleton Screens ─────────────────────────────────── */
#skeletonScreen {
  position: absolute; inset: 0; z-index: 100; background: var(--surface);
  border-radius: var(--radius-lg); padding: clamp(18px,3vw,32px);

}
.sk {

}

/* ─── 25. Animations & Keyframes ───────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -600px 0; }
  100% { background-position:  600px 0; }
}
@keyframes progress-shine {
  0%   { background-position: -200px 0; }
  100% { background-position:  200px 0; }
}
@keyframes fadeInOvl {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideUpBox {
  from { transform: translateY(18px); opacity: 0; }

}
@keyframes slideUpToast {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(10px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
